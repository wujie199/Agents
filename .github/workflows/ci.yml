name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pyyaml redis

      - name: Run tests
        run: |
          pytest tests/test_health_checks.py \
            tests/test_l4_redis_cache.py \
            tests/test_context_factory.py \
            tests/test_context_factory_rag_tenant.py \
            tests/test_retrieval_router.py \
            tests/test_context_builder.py \
            tests/test_secondary_fixes.py \
            tests/test_chat_turn.py \
            tests/test_chat_service.py \
            tests/test_chat_langgraph.py \
            tests/test_compliance.py \
            tests/test_memory_port.py \
            tests/test_name_remember.py \
            tests/test_memory_mvp_scenarios.py \
            tests/test_recall_prefetch_miss.py \
            tests/test_session_search_fixes.py \
            tests/test_l1_storage.py \
            tests/test_phase2_memory.py \
            tests/test_cold_archive.py \
            tests/test_memory_bootstrap.py \
            tests/test_phase3_memory.py \
            tests/test_l4_external.py \
            tests/test_skill_adapter.py \
            tests/test_memory_api.py \
            tests/test_checkpointer.py \
            tests/test_turn_buffer.py \
            tests/test_tool_dispatch.py \
            tests/test_infrastructure.py \
            tests/test_session_finalize.py \
            tests/test_enterprise_memory.py \
            -q --tb=short
