[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agents"
version = "0.2.0"
description = "Agents platform: document RAG, OCR, and core ports"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "document*", "agent_platform*", "app*", "utils*"]

[project.optional-dependencies]
langgraph = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langgraph-checkpoint-sqlite>=2.0",
  "langgraph-checkpoint-postgres>=2.0",
]
planning = [
  "deepagents>=0.6,<0.7",
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
eval = [
  "ragas>=0.2.8",
  "datasets",
  "openai",
  # ragas 0.4.x imports langchain_community.chat_models.vertexai at load time;
  # community>=0.4 removed it; community 0.2.x breaks on langchain-core 1.x (pydantic_v1).
  "langchain-core>=1.3",
  "langchain-community>=0.3.31,<0.4",
  "langchain-openai>=0.3",
  "langchain-huggingface",
  "plotly",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
