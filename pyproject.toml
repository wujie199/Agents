[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agents"
version = "0.2.0"
description = "Agents platform: document RAG, OCR, and core ports"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "document*", "agent_platform*", "app*", "utils*"]

[project.optional-dependencies]
langgraph = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langgraph-checkpoint-sqlite>=2.0",
  "langgraph-checkpoint-postgres>=2.0",
]
planning = [
  "deepagents>=0.6,<0.7",
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
