skill_id: example
version: "1.0.0"
title: 报告生成示例
summary: |
  根据用户意图匹配报告类任务。
  加载摘要后由 SkillExecutor 按 steps 执行。
  适用于结构化报告生成场景。
triggers:
  - 报告
  - 生成报告
  - report
required_tools:
  - skill_echo
max_duration_seconds: 300
acl:
  - user
  - cli
  - test
steps:
  - action: echo
    tool: skill_echo
    args_template:
      message: "$inputs.message"
    on_failure: skip
