# Word 合同建库 profile — 增量覆盖 config/rag.yml（OCR + 七步 + legal/privacy 清洗）
# 用法: python document/build_rag_index.py --profile contract contract.docx

enable_graph_index: false

chunk_pipeline:
  domain: legal

cleaners:
  default:
    name: contract_default
    cleaners:
      - type: unicode_normalizer
      - type: html
      - type: special_char
        preserve_chinese: true
        preserve_punctuation: true
      - type: legal
      - type: privacy
        mask_phone: true
        mask_email: true
        mask_id_card: true
        mask_bank_card: true
      - type: whitespace
      - type: duplicate
      - type: length_filter
        min_length: 5
        min_meaningful_chars: 3
  domains:
    word:
      name: contract_word
      cleaners:
        - type: unicode_normalizer
        - type: legal
        - type: privacy
          mask_phone: true
          mask_email: true
          mask_id_card: true
          mask_bank_card: true
        - type: whitespace
        - type: duplicate
        - type: length_filter
          min_length: 5
          min_meaningful_chars: 3

retrieval:
  hybrid_weights: [0.5, 0.5]
  enable_router: false
  auto_route: false

rewrite:
  enable_multi_query: false
