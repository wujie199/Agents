# RAG 基座（profile 增量见 rag.faq.yml / rag.contract.yml；模型见 models.yml）

collection_name: agent

# 图索引二期预留；faq/contract 与 production example 均为 false
enable_graph_index: false

# 仅 chunk_strategy != seven_step 时使用；七步粒度见 chunk_pipeline
chunk_size: 800
chunk_overlap: 0
chunk_strategy: seven_step

embedding:
  backend: local_bge
  normalize: true
  max_tokens: 512
  truncate_marker: "[...]"
  query_instruction: "为这个句子生成表示以用于检索相关文章："
  batch_size: 32
  oom_halve_retry: true
  reject_zero_vectors: true
  write_max_retries: 3
  dlq_path: data/rag_offline/embedding_dlq.jsonl
  enable_chunk_incremental: true
  enable_embedding_cache_read: true
  incremental_on_reindex: true
  # force-reindex 时删旧向量并全量写入（验证 Paddle OCR 后日常可改回 false）
  force_full_delete_on_reindex: true
  versioned_collection: false

chunk_pipeline:
  parent_store_dir: data/rag_offline/parent_chunks

storage:
  chroma:
    persist_directory: chroma_db
    hnsw_space: cosine
    hnsw_construction_ef: 200
    hnsw_search_ef: 100
    hnsw_M: 16
    k: 10
    hybrid_search: false
    bm25_k: 10
    hybrid_weights: [0.5, 0.5]

metadata:
  rules:
    - name: contract
      tags: [合同, 法律]
      keywords: [甲方, 乙方, 违约责任, 合同编号, 合同, 协议, 签署]
      match: any
    - name: rental
      tags: [租赁, 合同]
      keywords: [租房, 租金, 押金, 租期, 房东, 租客]
      match: any
    - name: finance
      tags: [财务, 发票]
      keywords: [发票, 税率, 金额, 付款, 账单]
      match: any
    - name: technical
      tags: [技术文档]
      keywords: [API, 接口, 部署, 配置, 架构]
      match: any
    - name: hr
      tags: [人事]
      keywords: [员工, 入职, 离职, 薪资, 考勤]
      match: any
    - name: maintenance
      tags: [maintenance, 维护保养]
      keywords: [维护保养, 清洁机器人时, 断开电源, 尘盒, 主刷, 边刷, 滤网, 充电触点, 机身外壳]
      match: any
  extension_tags:
    pdf: [pdf]
    docx: [word]
    doc: [word]
    md: [markdown]
    txt: [text]

scenarios:
  default_scenario: null
  items:
    customer_service:
      tags: [FAQ, 售后, 租赁]
      tag_match: any
    legal:
      tags: [合同, 法律]
      tag_match: any
    finance:
      tags: [财务, 发票]
      tag_match: any
    technical:
      tags: [技术文档, API]
      tag_match: any
    hr:
      tags: [人事]
      tag_match: any
    product:
      tags: [产品]
      tag_match: any

ingest:
  ocr_fast: false
  # false = 每页强制 Paddle OCR（验证用）；生产 FAQ 可改回 true 走 native 抽字
  enable_pdf_routing: false
  pdf_dpi: 300
  pdf_threads: 1
  ocr_enable_mkldnn: false
  # 降低版面框阈值，减少 FAQ 短块漏检（默认 0.5）
  ocr_layout_threshold: 0.35
  ocr_layout_score_threshold: 0.35
  ocr_max_attempts: 4
  ocr_formula_model: PP-FormulaNet_plus-S

retrieval:
  enable_hybrid: true
  enable_rerank: true
  hybrid_weights: [0.32, 0.68]
  rerank_min_score: 0.4
  auto_route: false

rewrite:
  enable_multi_query: true
  two_stage:
    enabled: true
    top1_min_rerank: 0.75
    require_maintenance_source: true

eval:
  generation:
    model_role: eval_generation_llm
    memory_system: "你是知识库 FAQ 问答助手。请基于检索片段准确、简洁地回答用户问题，只答所问，保留原文中的数字与步骤。"
    max_evidence_chars: 3000
    max_evidence_items: 2
    rag_min_score: 0.0
    rag_min_keep: 1
    strict_grounding: true
    eval_strict_answer: true
    temperature: 0
    max_tokens: 320
    enable_thinking: false
  judge:
    model_role: eval_judge_llm
    embedding_role: embedding
  metrics:
    full:
      - context_precision
      - context_recall
      - faithfulness
      - answer_relevancy
      - answer_correctness
      - context_relevancy
    retrieval_only:
      - context_precision
      - context_recall
  ir:
    enabled: true
    ks: [1, 3, 5]
    min_overlap_chars: 20
  output:
    results_dir: data/rag_eval/results
    preview_chars: 500
