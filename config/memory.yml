# Memory — 默认值见 config_loader.DEFAULT_MEMORY_CONFIG；L0 压缩唯一配置源
l1:
  store_dir: data/memory_dev

l4:
  provider: none

l0:
  l0_context_compress_enabled: true
  context_compress_threshold: 0.50
  compress_target_ratio: 0.20
  l0_context_window_tokens: 128000
  l0_anti_jitter_pct: 0.10
  l0_tool_prune_min_chars: 200

profiles:
  vector:
    enable_cold_archive: false
    skill_auto_extract_draft: false
    session_vector_dir: data/session_vectors_dev
  cold:
    enable_session_vector_index: false
    enable_cold_archive: true
    cold_archive_prefix: l2/cold/dev
  skills:
    enable_session_vector_index: false
    enable_cold_archive: false
    skill_auto_extract_draft: true
    skill_auto_extract_min_steps: 2
  l4_http:
    enable_session_vector_index: false
    enable_cold_archive: false
    external_profiles_backend: http
    external_profiles_http_url: http://127.0.0.1:8765
    external_profiles_http_timeout: 5
    external_profile_cache_ttl: 60
