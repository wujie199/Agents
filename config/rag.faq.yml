# FAQ/PDF 建库 profile — 增量覆盖 config/rag.yml（OCR + 七步分块）
# 用法: python document/build_rag_index.py --profile faq data/test_docs/*.pdf

enable_graph_index: false

chunk_pipeline:
  domain: faq
  child_target_chars: 400

ingest:
  enable_header_footer_dedup: true

cleaners:
  default:
    name: faq_default
    cleaners:
      - type: unicode_normalizer
      - type: special_char
        preserve_chinese: true
        preserve_punctuation: true
      - type: whitespace
      - type: noise
      - type: duplicate
      - type: length_filter
        min_length: 5
        min_meaningful_chars: 3

retrieval:
  enable_router: false
  auto_route: false

rewrite:
  enable_multi_query: false
