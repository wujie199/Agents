# RAG 生产配置示例（模型路径见 config/models.yml + 环境变量）
# 用法: export RAG_CONFIG=config/rag.production.example.yml

collection_name: agent
enable_vector_index: true
enable_graph_index: false

chunk_size: 800
chunk_overlap: 0
chunk_strategy: faq
default_top_k: 10
rerank_top_n: 5
enable_cache: true
cache_ttl_seconds: 900
model_version: bge-small-zh-v1.5-local
embedding_batch_size: 32

metadata:
  enabled: true
  backend: rule_keyword

ingest:
  mode: ocr_only
  routing: simplified
  ocr_device: cpu

retrieval:
  primary_backend: vector
  enable_hybrid: true
  enable_vector_search: true
  enable_bm25_search: true
  enable_rerank: true
  enable_router: true
  auto_route: true
  use_mock_rerank_fallback: false
  enable_graph: false
  enable_sql: false
  rerank_min_score: 0.35

rewrite:
  enable_hyde: false
  enable_multi_query: false
