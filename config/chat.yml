# 对话 Agent（企业级记忆 Context + Path B 工具）
# LLM 角色见 config/models.yml（main_llm / router_llm / memory_summarizer_llm）
chat:
  enable_rag: true
  max_history_turns: 6
  max_evidence_chars: 4000
  max_evidence_items: 5
  rag_min_score: 0.55
  rag_min_keep: 2
  model_role: main_llm

  # Context Builder：字符预算 + 滚动摘要 + RAG 门控
  max_history_chars: 8000
  recent_turns: 6
  enable_rag_gating: true
  rag_gating_min_chars: 4
  enable_rolling_summary: true
  rolling_summary_max_chars: 1500
  use_llm_rolling_summary: false
  summarizer_role: memory_summarizer_llm
  session_search_prefetch: true
  session_search_prefetch_limit: 3
  session_search_prefetch_max_chars: 1200
  session_search_prefetch_scope: auto   # auto | session | user
  # 知识类 L2 预检索用截断拼接（避免 LLM 二次摘要慢且带入历史幻觉）
  session_search_use_llm_summary: false
  session_search_llm_on_recall: false
  skill_prefetch: true
  l4_profile_prefetch: true

  # 检索编排：回忆类走 L2 session_search，知识类走 RAG，互斥短路
  retrieval_orchestration: true
  recall_wins_over_rag: true
  knowledge_skips_recall: true
  # 回忆 + RAG 并行融合（混合意图 recall_and_knowledge：同时走 session_search + RAG）
  recall_rag_fusion: true
  fusion_recall_weight: 0.6
  fusion_rag_weight: 0.4
  # 知识类问题同时预检索 L2 会话（与 RAG 并行）
  knowledge_session_search: true
  # 知识类问题：仅当 query 命中 L4/profile 模式时预取（非全量注入）
  l4_prefetch_on_knowledge: true
  recall_skip_rag_when_prefetch_hit: true
  # 回忆预检索未命中时是否跳过 RAG（false=仍走 RAG 作补充）
  recall_skip_rag_when_prefetch_miss: false
  # 滚动摘要仅保留 user 发言，降低 assistant 幻觉污染
  rolling_summary_user_only: true
  # 有 RAG 证据时强制 grounding
  evidence_strict_grounding: true
  # 知识类 RAG 未命中时明确告知用户，禁止编造
  refuse_hallucination_on_rag_miss: true
  # 回忆未命中时提示 Agent 调用 session_search 工具
  recall_tool_hint_on_miss: true
  # LLM 意图路由（默认开启，正则做硬规则快速通道，LLM 做软路由）
  retrieval_llm_router: false
  retrieval_router_role: router_llm
  retrieval_router_confidence_min: 0.6

  # 知识/寒暄直连 LLM（证据已在 prepare 注入，无需 ReAct 工具环）
  knowledge_direct_llm: true
  # Path B：LangGraph 记忆工具（L1/L2/L3/L4）
  enable_memory_tools: true
  enable_skill_tools: true
  enable_l4_tools: true
  remember_require_hitl: true
  auto_confirm_pending_on_exit: false

  # dev REPL：免 HITL、退出时自动确认 pending
  profiles:
    dev:
      remember_require_hitl: false
      auto_confirm_pending_on_exit: true

  # 交互场景每轮 flush L2（避免 turn_buffer 延迟）
  interactive_flush_buffer: true

  # 会话结束 L2→L1 结构化抽取（白名单 key）
  enable_l1_extract_on_finalize: true
  use_llm_l1_extract: true
  l1_extract_max_turns: 20
  l1_extract_max_items: 5
  l1_extract_allowed_keys:
    - 称呼
    - 姓名
    - 职业
    - 语言
    - 输出格式
    - 时区
    - 项目

  # L1 置信度分层自动写入
  l1_auto_write_confidence_min: 0.9
  # L1 冲突策略：overwrite | keep_old | ask_user
  l1_conflict_strategy: ask_user

  # 时间衰减：近期 session_search 结果权重高于远期
  time_decay: true
  time_decay_half_life_days: 90

  # L0 上下文压缩（Hermes Phase A）：prompt tokens >= threshold × context_window 时触发
  l0_context_compress_enabled: true
  context_compress_threshold: 0.50
  compress_target_ratio: 0.20
  context_window_tokens: 128000

observability:
  enabled: true
  trace_header: X-Request-ID
  slow_threshold_ms:
    prepare: 2000
    agent: 8000
    persist: 500
  # 图节点 QPS 限流：memory | redis（设 REDIS_URL 时自动选 redis）
  rate_limit_backend: memory
  max_qps_per_tenant: 100
  # 审计 NDJSON 持久化（data/audit/audit_YYYY-MM-DD.jsonl）
  audit_persist: true
  audit_log_dir: data/audit
  # OpenTelemetry（环境变量，非 YAML）:
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318/v1/traces
  # OTEL_SERVICE_NAME=agents-chat
  # OTEL_TRACES_SAMPLER_ARG=0.1   # head sampling 比例 0.0–1.0

# DeepAgents 规划层（可选依赖，pip install 'agents[planning]'）
# 外层规划 harness：复杂任务分解 → 子Agent调度 → 上下文隔离
deep_agent:
  enable: false
  semantic_gate: true
  gate_threshold: 0.7
  planning_model_role: main_llm
  system_prompt: "你是企业助手。简单问题委托 chat-worker，研究任务委托 research-agent，报告生成委托 report-writer。"
  complex_task_patterns:
    - "先.*再.*然后"
    - "帮我写.*报告"
    - "对比分析"
    - "制定.*方案"
    - "写一份.*文档"
    - "分析.*并.*建议"
  # 子Agent 定义（除 chat-worker 自动桥接外）
  subagents: []
  #  # - name: research-agent
  #  #   description: 深度检索：多轮RAG+跨源摘要合成
  #  #   prompt: 你是深度研究员，擅长综合多源信息产出结构化分析
  #  #   model: openai:gpt-4o
  #  # - name: report-writer
  #  #   description: 长文写作：大纲→章节并行→合并审查
  #  #   prompt: 你是专业报告撰写员
  #  #   model: openai:gpt-4o
  interrupt_on:
    delete_file:
      allowed_decisions:
        - approve
        - reject
