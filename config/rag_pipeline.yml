# RAG 管道配置（行为参数；模型路径见 config/models.yml）

collection_name: agent

enable_vector_index: true
enable_graph_index: true

chunk_size: 800
chunk_overlap: 0
chunk_strategy: faq
default_top_k: 10
rerank_top_n: 5
enable_cache: true
cache_ttl_seconds: 900
model_version: bge-small-zh-v1.5-local
embedding_batch_size: 32

# Chroma 存储（原 config/chroma.yml 已合并）
storage:
  chroma:
    persist_directory: chroma_db
    hnsw_space: cosine
    hnsw_construction_ef: 200
    hnsw_search_ef: 100
    hnsw_M: 16
    k: 10
    hybrid_search: false
    bm25_k: 10
    hybrid_weights: [0.5, 0.5]

metadata:
  enabled: true
  backend: rule_keyword
  rules_path: null
  max_tags: 32
  tag_filename: true

ingest:
  mode: ocr_only
  routing: simplified
  plain_text_formats: [txt, md]
  ocr_backend: auto
  language: ch
  word_to_pdf: true
  word_converter: libreoffice
  pdf_dpi: 200
  ocr_use_layout: true
  enable_cleaning: true
  ocr_postprocess: true
  cleaning_level: standard
  ocr_device: cpu
  ocr_preprocess: auto
  ocr_enable_formula: true
  ocr_formula_model: PP-FormulaNet_plus-S
  ocr_max_attempts: 3
  ocr_fast: true
  ocr_table_e2e: false
  ocr_enable_mkldnn: true

retrieval:
  primary_backend: vector
  enable_hybrid: true
  enable_vector_search: true
  enable_bm25_search: true
  vector_top_k: 10
  bm25_top_k: 10
  hybrid_weights: [0.5, 0.5]
  fusion_strategy: weighted
  fusion_top_n: 10
  enable_rerank: true
  rerank_top_n: 5
  rerank_min_score: 0.4
  use_mock_rerank_fallback: true
  enable_router: true
  auto_route: false
  enable_graph: false
  enable_sql: false

rewrite:
  enable_hyde: false
  enable_multi_query: false
  multi_query_count: 3
