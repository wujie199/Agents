# 隐私脱敏规则配置
# 用于 PrivacyPortAdapter 的 PII 检测与脱敏
privacy:
  # PII 检测正则
  patterns:
    phone: "1[3-9]\\d{9}"
    email: "[\\w\\.-]+@[\\w\\.-]+\\.\\w+"
    id_card: "\\d{17}[\\dXx]"
    bank_card: "\\d{16,19}"

  # 敏感度分级
  sensitivity:
    # 身份证、银行卡 → SECRET（不可缓存）
    secret_patterns:
      - id_card
      - bank_card
    # 手机、邮箱 → PII（短缓存）
    pii_patterns:
      - phone
      - email
