# 模型配置 — 唯一真相源
# instances：每类模型物理配置只定义一次
# roles：业务职责映射（可独立 fallback / 限流）
#
# 环境变量（可选覆盖）：LOCAL_LLM_*、RAG_EMBEDDING_MODEL_PATH、
#           RAG_RERANK_MODEL_PATH、OCR_MODEL_ROOT
# api_key 可直接写在 instances 中（dev）；生产建议改用 api_key_env

providers:
  dashscope:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  openai:
    base_url: https://api.openai.com/v1

instances:
  dashscope_chat:
    kind: llm
    provider: dashscope
    model_name: qwen3.6-flash
    api_key: sk-d922c27b5c4b4ed284e30ae0ba70743f
    timeout: 120

  ollama_chat:
    kind: llm
    provider: openai
    model_name: ""
    model_name_env: LOCAL_LLM_MODEL
    api_key: ollama
    api_key_env: LOCAL_LLM_API_KEY
    base_url: http://127.0.0.1:11434/v1
    base_url_env: LOCAL_LLM_BASE_URL
    timeout: 8

  local_hf_chat:
    kind: llm
    provider: local_hf
    model_name: local-hf
    model_path: /Volumes/wj/model/llm/Qwen3-0.6B

  embedding_bge:
    kind: embedding
    provider: local_bge
    model_path: /Volumes/wj/model/embedding/bge-small-zh-v1.5
    normalize: true

  rerank_bge:
    kind: rerank
    provider: local_bge
    model_path: /Volumes/wj/model/rerank/bge-reranker-base

  ocr_paddle:
    kind: ocr
    provider: paddleocr
    model_root: /Volumes/wj/model/ocr

roles:
  main_llm:
    instance: dashscope_chat
    context_window_tokens: 128000
    fallback_chain:
      - ollama_chat
      - local_hf_chat
    resilience:
      max_retries: 2
      retry_on_status: [502, 503, 504]
      circuit_breaker:
        failure_threshold: 5
        recovery_timeout: 60

  router_llm:
    instance: dashscope_chat
    fallback_chain: []
    resilience:
      max_retries: 2
      retry_on_status: [502, 503, 504]
      circuit_breaker:
        failure_threshold: 5
        recovery_timeout: 60

  memory_summarizer_llm:
    instance: ollama_chat
    fallback_chain:
      - dashscope_chat
      - local_hf_chat
    resilience:
      max_retries: 2
      circuit_breaker:
        failure_threshold: 3
        recovery_timeout: 30

  embedding:
    instance: embedding_bge
    cache:
      enabled: true
      ttl_seconds: 86400

  rerank:
    instance: rerank_bge

  ocr:
    instance: ocr_paddle

  # RAGAS 评测专用：固定 DashScope，不走本地 HF/Ollama fallback
  eval_generation_llm:
    instance: dashscope_chat
    fallback_chain: []
    resilience:
      max_retries: 2
      retry_on_status: [502, 503, 504]

  eval_judge_llm:
    instance: dashscope_chat
    fallback_chain: []
    resilience:
      max_retries: 2
      retry_on_status: [502, 503, 504]
