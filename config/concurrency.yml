# 并发与批处理配置
chat:
  enabled: true
  tenant_requests_per_minute: 60
  user_requests_per_minute: 20
  # 分布式限流（可选）：export CHAT_RATE_LIMIT_REDIS_URL=redis://localhost:6379/0

default:
  max_parallel_sends: 5
  max_intra_batch_workers: 3
  default_batch_size: 10
  min_batch_size: 1
  max_batch_size: 50
  max_rag_batch_queries: 10
  max_embed_batch_size: 32

# 租户级覆盖（可选）
tenants:
  tenant_premium:
    max_parallel_sends: 10
    default_batch_size: 20
    max_batch_size: 100
