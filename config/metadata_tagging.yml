# 规则/关键词元数据打标（document.rag.adapters.metadata.rule_keyword）
# match: any = 任一关键词命中；all = 全部关键词命中

rules:
  - name: contract
    tags: [合同, 法律]
    keywords: [甲方, 乙方, 违约责任, 合同编号]
    match: any

  - name: rental
    tags: [租赁, 合同]
    keywords: [租房, 租金, 押金, 租期, 房东, 租客]
    match: any

  - name: finance
    tags: [财务, 发票]
    keywords: [发票, 税率, 金额, 付款, 账单]
    match: any

  - name: technical
    tags: [技术文档]
    keywords: [API, 接口, 部署, 配置, 架构]
    match: any

  - name: hr
    tags: [人事]
    keywords: [员工, 入职, 离职, 薪资, 考勤]
    match: any

# 按文件扩展名附加标签（可选）
extension_tags:
  pdf: [pdf]
  docx: [word]
  doc: [word]
  md: [markdown]
  txt: [text]
