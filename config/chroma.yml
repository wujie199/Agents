# chroma 地址
persist_directory: chroma_db

# 数据库名称
collection_name: agent

# hnsw 索引策略
hnsw:space: cosine
hnsw:construction_ef: 200
hnsw:search_ef: 100
hnsw:M: 16

# 切块参数
chunk_size: 200
chunk_overlap: 20
separators: ["\n\n", "\n", " ", ".","!","?"]

k: 10

# 是否开启混合检索
hybrid_search: false
bm25_k: 10
# 两路权重，顺序为 [向量检索, BM25]
hybrid_weights: [0.5, 0.5]

# md5 保存文件夹
md5_hex_store: md5.txt

# rag 资料文件
data_path: data
# rag 文件夹能扫描到的文件类型
allowed_konwledge_file_type: ["pdf", "txt"]

# 以下文件仅写入路由集合，避免与道路知识混检
exclude_filenames:
  - 常见问题.txt